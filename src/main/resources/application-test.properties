# Integration tests run against a disposable MySQL container started by Testcontainers.
# spring.datasource.url / username / password / driver-class-name and hibernate.ddl-auto
# are supplied at runtime by BaseTest via @DynamicPropertySource, so they are not set here.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8081
