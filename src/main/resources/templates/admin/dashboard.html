<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="ISO-8859-1">
    <title>Admin's Dashboard</title>
    <link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <style>
        /* Theme accent color (#f1bc31), scoped to this page only — Bootstrap's default
           blue is used by .btn-primary/.pagination elsewhere too (e.g. bookdetails.html's
           "Update review" button), so these overrides target only this page's elements. */
        #addBookBtn {
            background-color: #f1bc31;
            border-color: #f1bc31;
            color: #fff;
        }
        #addBookBtn:hover {
            background-color: #d9a520;
            border-color: #d9a520;
            color: #fff;
        }
        .pagination .page-link {
            color: #f1bc31;
        }
        .pagination .page-link:hover {
            color: #d9a520;
        }
        .pagination .page-item.active .page-link {
            background-color: #f1bc31;
            border-color: #f1bc31;
            color: #fff;
        }
        /* The preview modal reuses bookdetails.html's markup, whose cover image is
           sized for the full page layout — inside the narrower modal that leaves it
           looking small, so it's scaled up here, scoped to just the preview modal. */
        .preview-book-body .main-img img {
            width: 100% !important;
            max-width: 480px !important;
            height: auto !important;
        }
        #dashboardTitle {
            display: inline-block;
            position: relative;
            opacity: 0;
            animation: dashboardTitleFadeIn 0.6s ease-out forwards;
        }
        #dashboardTitle::after {
            content: '';
            display: block;
            margin: 6px auto 0;
            width: 0;
            height: 3px;
            background-color: #f1bc31;
            animation: dashboardTitleUnderline 0.5s ease-out 0.5s forwards;
        }
        @keyframes dashboardTitleFadeIn {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes dashboardTitleUnderline {
            from {
                width: 0;
            }
            to {
                width: 90px;
            }
        }
        /* Cover-photo-style book flat lay behind the title/stats area, fading to
           nothing by the bottom via a mask gradient. saturate()/brightness() push it
           toward a softer, pastel look regardless of the source photo's own tones. */
        .dashboard-hero {
            position: relative;
            min-height: 220px;
        }
        .dashboard-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            background-image: url("https://res.cloudinary.com/c2zyj8h3/image/upload/v1790288463/books-create-worlds-stockcake.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            filter: saturate(0.55) brightness(1.18);
            opacity: 0.85;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div th:insert="/fragments/header.html :: header"></div>

<div class="container">
    <div class="dashboard-hero d-flex flex-column">
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="flex-grow-1 d-flex flex-column align-items-center justify-content-center">
        <h1 class="text-center mb-2"><span id="dashboardTitle">Admin's Dashboard</span></h1>
        <a id="addBookBtn" th:href="@{/admin/books/new}" class="btn btn-primary">Add New Book</a>
    </div>

    <div>
        <div class="row text-center align-items-center mt-2 mb-0">
            <div class="col-md-3">
                <strong th:text="${totalBooks}"></strong> Books
            </div>
            <div class="col-md-3">
                <strong th:text="${totalAuthors}"></strong> Authors
            </div>
            <div class="col-md-3">
                <strong th:text="${totalGenres}"></strong> Genres
            </div>
            <div class="col-md-3">
                <div class="dropdown">
                    <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" id="sortDropdown"
                            data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Sort: <span th:text="${sort == 'oldest'} ? 'Oldest' : 'Newest'"></span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="sortDropdown">
                        <a class="dropdown-item" th:href="@{/admin(sort='newest')}">Newest</a>
                        <a class="dropdown-item" th:href="@{/admin(sort='oldest')}">Oldest</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    <hr>

    <div th:if="${books.empty}">
        <h5>No books yet. Add your first one above.</h5>
    </div>

    <div class="row" th:unless="${books.empty}">
        <div class="col-12">
            <table class="table table-image">
                <thead>
                <tr>
                    <th scope="col">Book</th>
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">Genres</th>
                    <th scope="col">Pages</th>
                    <th scope="col">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book: ${books}">
                    <td class="w-15">
                        <img th:if="${book.imageUrl}" class="img-fluid rounded" height="120px" width="86px"
                             th:src="${book.imageUrl}"/>
                    </td>
                    <td th:text="${book.bookTitle}"/>
                    <td>
                        <span class="small text-muted text-uppercase mb-2" th:each="a, iterStat : ${book.authorInBooks}"
                              th:text="!${iterStat.last} ? ${a} + ', ': ${a}"></span>
                    </td>
                    <td>
                        <span th:each="g, iterStat : ${book.genresInBooks}"
                              th:text="!${iterStat.last} ? ${g} + ', ': ${g}"></span>
                    </td>
                    <td th:text="${book.pages}"/>
                    <td>
                        <button class="btn btn-outline-dark btn-sm" type="button" data-toggle="modal"
                                th:attr="data-target='#previewBookWindow' + ${book.id}">Preview</button>
                        <a th:href="@{'/admin/books/' + ${book.id} + '/edit'}" class="btn btn-outline-dark btn-sm">Edit</a>
                        <button class="btn btn-danger btn-sm" type="button" data-toggle="modal"
                                th:attr="data-target='#deleteBookWindow' + ${book.id}">Delete</button>

                        <div class="modal fade preview-book-modal" tabindex="-1" role="dialog" aria-hidden="true"
                             th:id="'previewBookWindow' + ${book.id}"
                             th:attr="data-book-id=${book.id}, aria-labelledby='previewBookWindowLabel' + ${book.id}">
                            <div class="modal-dialog modal-xl">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" th:text="${book.bookTitle}"></h5>
                                        <button aria-label="Close" class="close" data-dismiss="modal" type="button">
                                            <span aria-hidden="true">&times;</span></button>
                                    </div>
                                    <div class="modal-body preview-book-body">
                                        <p class="text-muted">Loading preview...</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="modal fade" tabindex="-1" role="dialog" aria-hidden="true"
                             th:id="'deleteBookWindow' + ${book.id}"
                             th:attr="aria-labelledby='deleteBookWindowLabel' + ${book.id}">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <div class="container d-flex pl-0">
                                            <h5 class="modal-title ml-2" th:text="'Delete ' + ${book.bookTitle} + '?'"></h5>
                                        </div>
                                        <button aria-label="Close" class="close" data-dismiss="modal" type="button">
                                            <span aria-hidden="true">&times;</span></button>
                                    </div>
                                    <div class="modal-body">
                                        <p class="text-muted">If you delete this book, it will be gone forever. Are you
                                            sure you want to proceed?</p>
                                    </div>
                                    <form method="POST" th:action="@{'/admin/books/' + ${book.id} + '/delete'}">
                                        <div class="modal-footer">
                                            <button class="btn btn-light" data-dismiss="modal" type="button">Cancel</button>
                                            <button class="btn btn-danger" type="submit">Delete</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <nav aria-label="Book pages" th:if="${books.totalPages > 1}">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${!books.hasPrevious()} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin(page=${books.hasPrevious() ? books.number - 1 : 0}, sort=${sort})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, books.totalPages - 1)}"
                        th:classappend="${pageNum == books.number} ? 'active'">
                        <a class="page-link" th:href="@{/admin(page=${pageNum}, sort=${sort})}" th:text="${pageNum + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${!books.hasNext()} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin(page=${books.number + 1}, sort=${sort})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<script th:src="@{/js/book-description-toggle.js}"></script>
<script th:src="@{/js/book-preview.js}"></script>

</body>
</html>
