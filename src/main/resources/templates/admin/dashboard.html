<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="ISO-8859-1">
    <title>Manage Books</title>
    <link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <style>
        /* Theme accent color (#f1bc31), scoped to this page only — Bootstrap's default
           blue is used by .btn-primary/.pagination elsewhere too (e.g. bookdetails.html's
           "Update review" button), so these overrides target only this page's elements. */
        #addBookBtn {
            background-color: #f1bc31;
            border-color: #f1bc31;
            color: #fff;
        }
        #addBookBtn:hover {
            background-color: #d9a520;
            border-color: #d9a520;
            color: #fff;
        }
        .pagination .page-link {
            color: #f1bc31;
        }
        .pagination .page-link:hover {
            color: #d9a520;
        }
        .pagination .page-item.active .page-link {
            background-color: #f1bc31;
            border-color: #f1bc31;
            color: #fff;
        }
    </style>
</head>
<body>

<div th:insert="/fragments/header.html :: header"></div>

<br>
<br>

<div class="container">
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="d-flex justify-content-between align-items-center">
        <h1>Manage Books</h1>
        <a id="addBookBtn" th:href="@{/admin/books/new}" class="btn btn-primary">Add New Book</a>
    </div>

    <div class="d-flex justify-content-end mt-3">
        <div class="dropdown">
            <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" id="sortDropdown"
                    data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Sort: <span th:text="${sort == 'oldest'} ? 'Oldest first' : 'Newest first'"></span>
            </button>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="sortDropdown">
                <a class="dropdown-item" th:href="@{/admin(sort='newest')}">Newest first</a>
                <a class="dropdown-item" th:href="@{/admin(sort='oldest')}">Oldest first</a>
            </div>
        </div>
    </div>

    <div class="row text-center mt-3 mb-2">
        <div class="col-md-4">
            <strong th:text="${totalBooks}"></strong> Books
        </div>
        <div class="col-md-4">
            <strong th:text="${totalAuthors}"></strong> Authors
        </div>
        <div class="col-md-4">
            <strong th:text="${totalGenres}"></strong> Genres
        </div>
    </div>
    <hr>

    <div th:if="${books.empty}">
        <h5>No books yet. Add your first one above.</h5>
    </div>

    <div class="row" th:unless="${books.empty}">
        <div class="col-12">
            <table class="table table-image">
                <thead>
                <tr>
                    <th scope="col">Book</th>
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">Genres</th>
                    <th scope="col">Pages</th>
                    <th scope="col">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book: ${books}">
                    <td class="w-15">
                        <img th:if="${book.imageUrl}" class="img-fluid rounded" height="120px" width="86px"
                             th:src="${book.imageUrl}"/>
                    </td>
                    <td th:text="${book.bookTitle}"/>
                    <td>
                        <span class="small text-muted text-uppercase mb-2" th:each="a, iterStat : ${book.authorInBooks}"
                              th:text="!${iterStat.last} ? ${a} + ', ': ${a}"></span>
                    </td>
                    <td>
                        <span th:each="g, iterStat : ${book.genresInBooks}"
                              th:text="!${iterStat.last} ? ${g} + ', ': ${g}"></span>
                    </td>
                    <td th:text="${book.pages}"/>
                    <td>
                        <a th:href="@{'/admin/books/' + ${book.id} + '/edit'}" class="btn btn-outline-dark btn-sm">Edit</a>
                        <button class="btn btn-danger btn-sm" type="button" data-toggle="modal"
                                th:attr="data-target='#deleteBookWindow' + ${book.id}">Delete</button>

                        <div class="modal fade" tabindex="-1" role="dialog" aria-hidden="true"
                             th:id="'deleteBookWindow' + ${book.id}"
                             th:attr="aria-labelledby='deleteBookWindowLabel' + ${book.id}">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <div class="container d-flex pl-0">
                                            <h5 class="modal-title ml-2" th:text="'Delete ' + ${book.bookTitle} + '?'"></h5>
                                        </div>
                                        <button aria-label="Close" class="close" data-dismiss="modal" type="button">
                                            <span aria-hidden="true">&times;</span></button>
                                    </div>
                                    <div class="modal-body">
                                        <p class="text-muted">If you delete this book, it will be gone forever. Are you
                                            sure you want to proceed?</p>
                                    </div>
                                    <form method="POST" th:action="@{'/admin/books/' + ${book.id} + '/delete'}">
                                        <div class="modal-footer">
                                            <button class="btn btn-light" data-dismiss="modal" type="button">Cancel</button>
                                            <button class="btn btn-danger" type="submit">Delete</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <nav aria-label="Book pages" th:if="${books.totalPages > 1}">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${!books.hasPrevious()} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin(page=${books.hasPrevious() ? books.number - 1 : 0}, sort=${sort})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, books.totalPages - 1)}"
                        th:classappend="${pageNum == books.number} ? 'active'">
                        <a class="page-link" th:href="@{/admin(page=${pageNum}, sort=${sort})}" th:text="${pageNum + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${!books.hasNext()} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin(page=${books.number + 1}, sort=${sort})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

</body>
</html>
